<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAr</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<header>
    <h1>LIAr</h1>
    <nav id="cabecalho">
        <ul class="lista-categorias">
            <li>Histórico</li>
            <li>Sair</li>
        </ul>
    </nav>
</header>
<body>
    <canvas id="bg-canvas"></canvas>
    <section id="login" class="screen active">
        <h1>LIAr</h1>
        <h2>Entrar</h2>
        <label for="email"></label>
        <input type="email" id="email"  name="email" placeholder="E-mail">
        <label for="password"></label>
        <input type="password" id="senha"  name="password" placeholder="Senha">
        <button id="entrar" type="submit" class="button-principal" onclick="navigateTo('selecionar-imagem')">Entrar</button>
        <a id="criar-conta">Ainda não tem conta? Crie sua conta</a>
    </section>
    <section id="selecionar-imagem" class="screen">
        <h1>Selecione uma imagem</h1>
        <h2 id="escrita-imagem">Escolha a imagem que você quer transformar em vídeo</h2>
        <div class="upload-area" id="uploadArea">
            <span class="upload-icon">⬆</span>
            <p class="upload-text">Clique para fazer upload</p>
            <p class="upload-hint">PNG, JPG até 10MB</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg" hidden>
        </div>
        <button id="button-continuar" type="button" class="button-principal">Continuar</button>
    </section>
    <section id="prompt" class="screen"></section>

<script src="script.js" defer></script>   
</body>
</html>
